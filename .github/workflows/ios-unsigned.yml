name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run unit tests and simulator UI smoke tests
        run: |
          set -euo pipefail
          python3 scripts/uitest_api_stub.py --port 18765 > api-stub.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:18765/health >/dev/null; then break; fi
            sleep 0.25
          done
          curl --silent --fail http://127.0.0.1:18765/health
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl spawn "$DEVICE" defaults write -g AVAudioSessionSilenceOutput -bool YES
          xcodebuild \
            -project ApuMusic.xcodeproj \
            -scheme ApuMusic \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath build \
            -resultBundlePath ApuMusicTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test | tee simulator-tests.log

      - name: Summarize XCTest results
        if: always()
        run: |
          set +e
          xcrun xcresulttool get test-results summary --path ApuMusicTests.xcresult | tee simulator-tests-summary.log

      - name: Export main-page screenshots
        run: |
          set -euo pipefail
          mkdir -p screenshots
          xcrun xcresulttool export attachments \
            --path ApuMusicTests.xcresult \
            --output-path screenshots
          python3 scripts/validate_screenshots.py screenshots ApuMusicTests.xcresult

      - name: Build Release for device
        run: |
          set -euo pipefail
          xcodebuild \
            -project ApuMusic.xcodeproj \
            -scheme ApuMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ApuMusic.app"
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/ApuMusic.app
          /usr/bin/zip -qry ApuMusic-0.1.0-build1-unsigned.ipa Payload
          shasum -a 256 ApuMusic-0.1.0-build1-unsigned.ipa > ApuMusic-0.1.0-build1-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ApuMusic-0.1.0-build1-unsigned
          path: |
            ApuMusic-0.1.0-build1-unsigned.ipa
            ApuMusic-0.1.0-build1-unsigned.ipa.sha256
          retention-days: 14

      - name: Upload simulator screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ApuMusic-simulator-screenshots-and-tests
          path: |
            screenshots/
            ApuMusicTests.xcresult
            simulator-tests-summary.log
            simulator-tests.log
            unit-tests-build.log
            api-stub.log
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ApuMusic-build-log
          path: xcodebuild.log
          retention-days: 7
