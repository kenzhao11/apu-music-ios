name: Package unsigned iOS IPA (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Release for device
        run: |
          set -euo pipefail
          xcodebuild \
            -project ApuMusic.xcodeproj \
            -scheme ApuMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ApuMusic.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/ApuMusic.app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          IPA="ApuMusic-${VERSION}-build${BUILD}-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          shasum -a 256 "$IPA" > "$IPA.sha256"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApuMusic-0.1.0-build2-unsigned-package-only
          path: |
            ApuMusic-0.1.0-build2-unsigned.ipa
            ApuMusic-0.1.0-build2-unsigned.ipa.sha256
          retention-days: 14
