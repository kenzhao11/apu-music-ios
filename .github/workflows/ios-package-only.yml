name: Package unsigned iOS IPA (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Release for device
        run: |
          set -euo pipefail
          xcodebuild \
            -project ApuMusic.xcodeproj \
            -scheme ApuMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/ApuMusic.app"
          mkdir -p Payload
          cp -R "$APP" Payload/ApuMusic.app
          IPA="ApuMusic-0.1.0-build7-unsigned.ipa"
          sips -s format png -z 120 120 ApuMusic/Assets.xcassets/AppIcon.appiconset/AppIcon.png --out Payload/ApuMusic.app/AppIcon60x60@2x.png >/dev/null
          sips -s format png -z 180 180 ApuMusic/Assets.xcassets/AppIcon.appiconset/AppIcon.png --out Payload/ApuMusic.app/AppIcon60x60@3x.png >/dev/null
          test "$(sips -g pixelWidth Payload/ApuMusic.app/AppIcon60x60@2x.png | awk '/pixelWidth/ {print $2}')" = 120
          test "$(sips -g pixelWidth Payload/ApuMusic.app/AppIcon60x60@3x.png | awk '/pixelWidth/ {print $2}')" = 180
          /usr/bin/zip -qry "$IPA" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApuMusic-0.1.0-build7-unsigned-package-only
          path: |
            ApuMusic-0.1.0-build7-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
