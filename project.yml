name: ApuMusic
options:
  bundleIdPrefix: fr.kdns.kenmusic
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ApuMusic:
    type: application
    platform: iOS
    sources:
      - ApuMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.kdns.kenmusic.apu
        INFOPLIST_KEY_CFBundleDisplayName: 阿噗音乐
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
