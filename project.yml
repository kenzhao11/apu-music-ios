name: ApuMusic
options:
  bundleIdPrefix: fr.kdns.kenmusic
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  ApuMusic:
    type: application
    platform: iOS
    info:
      path: ApuMusic/Info.plist
      properties:
        CFBundleName: 阿噗音乐
        CFBundleDisplayName: 阿噗音乐
        LSRequiresIPhoneOS: true
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: ApuMascot
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    sources:
      - path: ApuMusic
        excludes: [Info.plist, Assets.xcassets]
      - path: ApuMusic/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.kdns.kenmusic.apu
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ApuMusic/Info.plist
  ApuMusicTests:
    type: bundle.unit-test
    platform: iOS
    info:
      path: Tests-Info.plist
      properties:
        CFBundlePackageType: BNDL
    sources:
      - ApuMusicTests
    dependencies:
      - target: ApuMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fr.kdns.kenmusic.apu.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ApuMusic.app/ApuMusic"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ApuMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    info:
      path: UITests-Info.plist
      properties:
        CFBundlePackageType: BNDL
    sources:
      - ApuMusicUITests
    dependencies:
      - target: ApuMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fr.kdns.kenmusic.apu.uitests
schemes:
  ApuMusic:
    build:
      targets:
        ApuMusic: all
        ApuMusicTests: [test]
        ApuMusicUITests: [test]
    test:
      targets:
        - ApuMusicTests
        - ApuMusicUITests
      gatherCoverageData: false
